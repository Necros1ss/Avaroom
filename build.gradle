plugins {
    id 'java'
    id 'application'
}

group = 'com.avaroom'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'com.avaroom.Main'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
