plugins {
    id 'com.android.application'
}

def envFile = rootProject.file("scripts/.env")
def envProps = new Properties()

if (envFile.exists()) {
    envFile.withReader('UTF-8') { reader ->
        envProps.load(reader)
    }
}
def vpsHost = envProps.getProperty("VPS_HOST", "card.nekos.work")
def apiPort = envProps.getProperty("API_PORT", "3000")

android {
    namespace 'com.avaroom.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.avaroom.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "BASE_URL", "\"http://${vpsHost}/\""

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    sourceSets {
        main {
            res.srcDirs = [
                'src/main/res',
                'src/main/res-auth',
                'src/main/res-student',
                'src/main/res-landlord'
            ]
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.navigation:navigation-fragment:2.7.7'
    implementation 'androidx.navigation:navigation-ui:2.7.7'

    // Retrofit 2 & GSON Converter
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
}
